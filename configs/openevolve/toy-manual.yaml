# R3: OpenEvolve's function_minimization example with no LLM (manual mode).
#
# Derived from examples/function_minimization/config.yaml (v0.4.0). Only the
# llm, iteration and parallelism settings differ. In manual mode each prompt is
# written to <output>/manual_tasks_queue/<id>.json, and OpenEvolve waits for a
# matching <id>.answer.json containing {"answer": "..."}.
max_iterations: 2
checkpoint_interval: 1

llm:
  primary_model: "manual"
  manual_mode: true
  temperature: 0.7
  max_tokens: 16000
  timeout: 900          # seconds to wait for a hand-written answer

prompt:
  system_message: "You are an expert programmer specializing in optimization algorithms. Your task is to improve a function minimization algorithm to find the global minimum of a complex function with many local minima. The function is f(x, y) = sin(x) * cos(y) + sin(x*y) + (x^2 + y^2)/20. Focus on improving the search_algorithm function to reliably find the global minimum, escaping local minima that might trap simple algorithms."

database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  similarity_threshold: 0.99

evaluator:
  timeout: 60
  cascade_thresholds: [1.3]
  parallel_evaluations: 1   # one prompt at a time, so answers are easy to follow

diff_based_evolution: true
max_code_length: 20000
