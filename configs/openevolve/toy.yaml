# R5/R6: OpenEvolve's function_minimization example against the local LLM server.
#
# Derived from examples/function_minimization/config.yaml (v0.4.0). The llm,
# iteration, parallelism, seed and evolution-mode settings differ. The server
# runs as a sidecar in the same GPU job; jobs pass --api-base with the port it
# actually bound.
max_iterations: 10
checkpoint_interval: 1   # OpenEvolve 0.4.0 skips an interval checkpoint if that iteration fails, and saves none on SIGTERM

# No top-level seed: OpenEvolve derives one fixed LLM seed from it and sends it
# with every request, and vLLM honours it, so identical prompts got identical
# replies (job 93362). Sampling stays reproducible via database.random_seed.
random_seed: null

llm:
  primary_model: "afar-llm"                # name the local server exposes (configs/llm/serve.env)
  api_base: "http://127.0.0.1:8000/v1"     # default only; jobs override with --api-base
  api_key: "${AFAR_LLM_API_KEY}"           # random per job, exported by slurm/llm_serve.sh
  temperature: 0.7
  max_tokens: 4096                         # leaves room for the prompt in a 7B model's context window
  timeout: 300

prompt:
  system_message: "You are an expert programmer specializing in optimization algorithms. Your task is to improve a function minimization algorithm to find the global minimum of a complex function with many local minima. The function is f(x, y) = sin(x) * cos(y) + sin(x*y) + (x^2 + y^2)/20. Focus on improving the search_algorithm function to reliably find the global minimum, escaping local minima that might trap simple algorithms."

database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  similarity_threshold: 0.99
  random_seed: 42

evaluator:
  timeout: 60
  cascade_thresholds: [1.3]
  parallel_evaluations: 1   # raise after R6 passes

# Full rewrites: in job 93362 the 7B model ignored the SEARCH/REPLACE format in
# every reply and returned the whole program in a code block instead.
# enforce_evolve_blocks has NO effect in OpenEvolve 0.4.0: _serialize_config
# doesn't pass it to the workers, which is where it's applied (fixed on upstream
# main after 0.4.0, unreleased). Jobs 93369/93386 kept candidates with no markers.
# It's kept so it applies once a release has the fix; until then, the evaluator
# must reject edits outside the EVOLVE-BLOCK.
diff_based_evolution: false
enforce_evolve_blocks: true
max_code_length: 20000
